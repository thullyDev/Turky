# Transitive advisories from Tauri, syn, and ab_glyph/imageproc.
# Fail CI only on actionable vulnerabilities in our direct dependency choices.
[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste (proc-macro stack)
    "RUSTSEC-2024-0370", # proc-macro-error (syn)
    "RUSTSEC-2026-0192", # ttf-parser (ab_glyph)
    "RUSTSEC-2025-0081", # unic-char-property (tauri build)
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0100", # unic-ucd-ident
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2024-0429", # glib (Tauri GTK on Linux; patched in >=0.20)
]
