name: Unit Tests

on:
  pull_request:
    branches:
      - development
      - master

jobs:
  rust-tests:
    name: Rust Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        working-directory: lib
        run: cargo test