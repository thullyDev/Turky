[package]
name = "turky"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "turky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusb = "0.9"
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"

des = "0.8"
cbc = "0.1"
cipher = "0.4"

chrono = "0.4"
